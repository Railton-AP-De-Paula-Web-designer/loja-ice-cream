<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras</title>
    <link rel ="stylesheet" href="css/shopping.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700;900&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="shopping-header">
        </header>
    
    <main>
        
        <section class="shopping-hero-section">
            <div class="shopping-hero-container">
                
                <div class="shopping-logo-box">
                    <img src="./assets/footer-vitoria.png" alt="Logo Distribuidora Vitória" class="img-shopping-logo">
                </div>

                <div class="shopping-user-greeting">
                    <span class="greeting-text">Bem Vindo (a)</span>
                </div>

                <div class="shopping-welcome-box">
                    
                    <h1 class="shopping-main-title">
                        Faça o seu <br>
                        <span>Pedido</span>
                    </h1>
                    
                    <div class="shopping-divider">
                        <span class="divider-detail">❖</span>
                    </div>
                    
                    <p class="shopping-subtitle">
                        Escolha a excelência e o sabor dos nossos sorvetes para o seu negócio.
                    </p>
                    
                </div>

            </div>
        </section>

        </main>

    </body>
</html>
