<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Vitória | Nutri-Informe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700;900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/nutri.css">
</head>
<body>
    <header class="header">
        <div class="navbar-container">
            <nav class="navbar-content">
                <div class="logo">
                    <span class="logo-vitoria">Bem-vindo(a)</span>
                </div>

                <ul class="nav-links">
                    <li><a href="nav.html">Início</a></li>
                </ul>
            </nav>
        </div>
    </header>

<main class="nutri-container">
    <div class="conection-line"></div>

    <nav class="fruit-panel">
        <div class="fruit-grid">
            <button class="fruit-card" style="--fruit-color: #ff3b30; --glow-color: rgba(255, 59, 48, 0.6); ">
                <span class="fruit-name">morango</span>

            </button>
        </div>
    </nav>
    <section class="nutri-content">
        <div class="carousel-wrapper">
            <button class="arrow-btn arrow-left">&#10094;</button>

            <div class="display-card">
                <div class="card-visual">
                    <img src="./assets/nutri-morango.png" alt="morango" class="fruit-image">
                    <div class="main-fruit-title">morango</div> 
                </div>
                <div class="card-info">
                    <h3 class="info-header">BENEFÍCIOS NUTRICIONAIS:<br><span class="highlight-fruit">MORANGO</span></h3>

                    <ul class="nutrition-list">
                    <li>
                        <span class="nutri-icon">🌱</span>
                        <div class="nutri-text"><strong>Vitamina C:</strong>Antioxidante</div>

                    </li>
                    <li>
                        <span class="nutri-icon">💧</span>
                        <div class="nutri-text"><strong>Potássio:</strong>Regulação</div>

                    </li>
                    <li>
                        <span class="nutri-icon">⚡</span>
                        <div class="nutri-text"><strong>Energia:</strong>Sustentada</div>

                    </li>
                    <li>
                        <span class="nutri-icon">⚡</span>
                        <div class="nutri-text"><strong>Energia:</strong>Netiresato Natural</div>
                    </li>
                    <li>
                        <span class="nutri-icon">❤️</span>
                        <div class="nutri-text"><strong>Fibras Soluveis:</strong>Reicular</div>
                    </li>
                    </ul>

                    
                </div>
            </div>
            <button class="arrow-btn arrow-right">&#10095;</button>
        </div>

        <div class="panel-footer">
            <span class="footer-brand">A SUA PARCEIRA GOURMET</span>
            <button class="btn-back">VOLTAR AO INÍCIO</button>
            <div class="star-deco">&#10022;</div>
        </div>

    </section>
</main>
</body>
</html>
